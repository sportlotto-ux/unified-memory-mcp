[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-memory-mcp"
version = "0.9.0"
description = "Unified Hermes memory MCP: hermes-lcm + mnemosyne merged"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
local-embed = [
    "fastembed>=0.3",
]
local-vec = [
    "sqlite-vec>=0.1",
]
tokens = [
    "tiktoken>=0.7",
]
dev = [
    "pytest",
    "hypothesis>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
