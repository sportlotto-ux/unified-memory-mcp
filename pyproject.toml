[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-unified-memory"
version = "0.3.5"
description = "Unified Hermes memory MCP: hermes-lcm + mnemosyne merged"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
local-embed = [
    "fastembed>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
